# Minimal YAML setup (the same works with environment variables only).
# Built-in prompt; title, correspondent, document type, tags from existing tags,
# and document-date proposals from the first page image.
paperless:
  url: http://webserver:8000
  token: ${PAPERLESS_TOKEN}
llm:
  provider: ollama
  base_url: http://ollama:11434
  model: qwen3.5:4b
  options: {num_ctx: 4096, temperature: 0.1}
extraction:
  language: English
  tags: {enabled: true, max_tags: 3}
  document_date: {enabled: true}
