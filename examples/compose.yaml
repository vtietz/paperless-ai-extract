# Add this service to an existing paperless-ngx compose file (service names as in
# the official paperless-ngx examples: webserver, db, broker).
#   cp ai-extract.env.example ai-extract.env   # then set PAPERLESS_TOKEN etc.
services:
  ai-extract:
    image: ghcr.io/vtietz/paperless-ai-extract:0.1
    restart: unless-stopped
    depends_on: [webserver]
    env_file: ai-extract.env
    volumes:
      # Named volume: Docker initialises it with the image's ownership (uid 1000).
      # For a bind mount instead, create it first: mkdir ai-extract && chown 1000 ai-extract
      - ai-extract-data:/data
      # - ./ai-extract-config:/config:ro   # optional config.yaml, prompt, aliases
    stop_grace_period: 6m             # let a running request finish

  # Optional local model server. CPU works (about a minute per page); add GPU settings if available.
  # ollama:
  #   image: ollama/ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollama-models:/root/.ollama

volumes:
  ai-extract-data:
  # ollama-models:
