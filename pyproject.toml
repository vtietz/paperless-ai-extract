[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-ai-extract"
version = "0.1.0"
description = "Image- or text-based LLM metadata extraction for Paperless-ngx via its REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
paperless-ai-extract = "paperless_ai_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
